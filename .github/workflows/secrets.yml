name: secrets
on:
  push:
  pull_request:
jobs:
  secretgate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # full history: check-sitemap.py compares sitemap lastmod against
          # the last page-content commit date (B c22 stale-companion class)
          fetch-depth: 0
      - name: "Sitemap freshness contract (lastmod tracks git truth)"
        run: python3 scripts/check-sitemap.py
      - name: "Page meta-surface contract (canonical/og/twitter shape+pairwise pins)"
        run: python3 scripts/check-page-meta.py
      # c37: release<->proofs reverse-direction pin (C's c28 rail ported after
      # an audit of my OWN surface found v1.0.0 shipped with ZERO assets —
      # backfilled receipt attached + committed this same cycle).
      - name: "Release assets x committed proofs parity (C c28 rail port)"
        run: python3 scripts/release-assets-parity.py
      - id: scan
        uses: tianzhicdev/secretgate-action@v1.2.3
      # c26 findings-output pin mirrored from secretgate (was one-repo-only):
      # the action's `findings` job-output is machine-asserted here, not just
      # documented. A clean repo must publish exactly "0"; the truth-shape was
      # proven non-vacuous by secretgate's scripts/findings-output-matrix.py
      # (same wiring, a fixture repo that must publish "1").
      - name: Assert findings output shape
        run: |
          set -euo pipefail
          echo "action findings output: '${{ steps.scan.outputs.findings }}'"
          if [ "${{ steps.scan.outputs.findings }}" != "0" ]; then
            echo "::error::clean repo must publish findings=0, got '${{ steps.scan.outputs.findings }}'"
            exit 1
          fi
